<svg class="hero-art" viewBox="0 0 1600 780" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <style>:root {
  --maroon: #670001;
  --black: #000000;
  --white: #ffffff;
  --sand: #dcd7d4;
  --almond: #c3b79d;
  --off: #2c2a2b;
  --body: "NAMU 1960", sans-serif;
  --accent: "KyivType Sans", sans-serif;
  --display: "Alumni Sans", sans-serif;
}
.chess-board .board-wash { fill: var(--sand); }
.board-square { fill: var(--almond); opacity: .28; }
.board-lines { stroke: var(--off); stroke-width: .85; opacity: .18; }
.pawn-contact { fill: var(--off); opacity: .12; }
.hero-pawn, .hero-queen { fill: url(#pawn-tone); stroke: var(--maroon); stroke-width: 1; }
.hero-pawn .pawn-highlight, .hero-queen .pawn-highlight { fill: none; stroke: var(--sand); stroke-width: 1.1; opacity: .45; }
.hero-pawn { opacity: 0; }
.hero-queen { opacity: 1; transform-origin: 1120px 548px; }
</style>
  <defs>
    <linearGradient id="board-fade" x1="700" y1="440" x2="1460" y2="670" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0"/><stop offset=".35" stop-color="white" stop-opacity=".6"/><stop offset="1" stop-color="white"/>
    </linearGradient>
    <mask id="board-mask"><rect width="1600" height="780" fill="url(#board-fade)"/></mask>
    <linearGradient id="pawn-tone" x1="1060" y1="400" x2="1177" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#670001"/><stop offset=".42" stop-color="#670001"/><stop offset="1" stop-color="#2c2a2b"/>
    </linearGradient>
  </defs>
  <g class="chess-board" mask="url(#board-mask)">
    <!-- The projected board uses one shared grid for squares and movement. -->
    <g transform="matrix(76 -15 40 32 720 450)">
      <path class="board-wash" d="M0 0H8V8H0Z"/>
      <path class="board-square" d="M0 0h1v1h-1Z"/><path class="board-square" d="M2 0h1v1h-1Z"/><path class="board-square" d="M4 0h1v1h-1Z"/><path class="board-square" d="M6 0h1v1h-1Z"/><path class="board-square" d="M1 1h1v1h-1Z"/><path class="board-square" d="M3 1h1v1h-1Z"/><path class="board-square" d="M5 1h1v1h-1Z"/><path class="board-square" d="M7 1h1v1h-1Z"/><path class="board-square" d="M0 2h1v1h-1Z"/><path class="board-square" d="M2 2h1v1h-1Z"/><path class="board-square" d="M4 2h1v1h-1Z"/><path class="board-square" d="M6 2h1v1h-1Z"/><path class="board-square" d="M1 3h1v1h-1Z"/><path class="board-square" d="M3 3h1v1h-1Z"/><path class="board-square" d="M5 3h1v1h-1Z"/><path class="board-square" d="M7 3h1v1h-1Z"/><path class="board-square" d="M0 4h1v1h-1Z"/><path class="board-square" d="M2 4h1v1h-1Z"/><path class="board-square" d="M4 4h1v1h-1Z"/><path class="board-square" d="M6 4h1v1h-1Z"/><path class="board-square" d="M1 5h1v1h-1Z"/><path class="board-square" d="M3 5h1v1h-1Z"/><path class="board-square" d="M5 5h1v1h-1Z"/><path class="board-square" d="M7 5h1v1h-1Z"/><path class="board-square" d="M0 6h1v1h-1Z"/><path class="board-square" d="M2 6h1v1h-1Z"/><path class="board-square" d="M4 6h1v1h-1Z"/><path class="board-square" d="M6 6h1v1h-1Z"/><path class="board-square" d="M1 7h1v1h-1Z"/><path class="board-square" d="M3 7h1v1h-1Z"/><path class="board-square" d="M5 7h1v1h-1Z"/><path class="board-square" d="M7 7h1v1h-1Z"/>
      <path class="board-lines" vector-effect="non-scaling-stroke" d="M0 0H8V8H0ZM1 0V8M2 0V8M3 0V8M4 0V8M5 0V8M6 0V8M7 0V8M0 1H8M0 2H8M0 3H8M0 4H8M0 5H8M0 6H8M0 7H8"/>
    </g>
  </g>

  <g class="chess-move">
    <ellipse class="pawn-contact" cx="1120" cy="548" rx="60" ry="13"/>
    <g class="hero-pawn" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="1120" cy="538" rx="56" ry="14"/>
      <path d="M1064 536C1064 525 1073 519 1086 512C1103 493 1107 456 1105 427L1097 413H1143L1135 427C1133 456 1137 493 1154 512C1167 519 1176 525 1176 536C1165 551 1075 551 1064 536Z"/>
      <ellipse cx="1120" cy="413" rx="29" ry="7"/>
      <path d="M1105 405L1109 392H1131L1135 405Z"/>
      <circle cx="1120" cy="359" r="35"/>
      <path class="pawn-highlight" d="M1099 345C1105 334 1115 331 1122 333M1113 436C1113 465 1108 492 1096 510M1077 533C1096 541 1142 542 1162 533M1100 412C1112 416 1129 416 1140 412"/>
    </g>

    <g class="hero-queen" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="1120" cy="538" rx="56" ry="14"/>
      <path d="M1064 536C1064 525 1073 519 1086 512C1100 491 1105 443 1103 399H1137C1135 443 1140 491 1154 512C1167 519 1176 525 1176 536C1165 551 1075 551 1064 536Z"/>
      <ellipse cx="1120" cy="401" rx="30" ry="7"/>
      <path d="M1093 389L1086 372H1154L1147 389Z"/>
      <ellipse cx="1120" cy="388" rx="30" ry="6"/>
      <path d="M1086 372L1063 303L1092 329L1090 285L1110 320L1120 269L1130 320L1150 285L1148 329L1177 303L1154 372Z"/>
      <circle cx="1063" cy="301" r="6"/><circle cx="1090" cy="283" r="6"/>
      <circle cx="1120" cy="267" r="7"/><circle cx="1150" cy="283" r="6"/>
      <circle cx="1177" cy="301" r="6"/>
      <path class="pawn-highlight" d="M1094 363H1146M1099 388C1111 391 1129 391 1141 388M1112 420C1112 461 1107 490 1096 510M1077 533C1096 541 1142 542 1162 533M1091 343L1097 359"/>
    </g>
  </g>
</svg>